spring.application.name=dev-social
# Cloud hosts (Render, Fly, Railway, Cloud Run...) tell the app which port to listen on via PORT.
server.port=${PORT:8080}
server.shutdown=graceful

# Managed Postgres usually needs SSL: DB_URL=jdbc:postgresql://HOST:5432/DB?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devsocial}
spring.datasource.username=${DB_USERNAME:devsocial}
spring.datasource.password=${DB_PASSWORD:devsocial}
# Free/small Postgres plans allow few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# MVP convenience. Move to Flyway/Liquibase migrations before storing anything you can't lose.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# REQUIRED, 32+ characters, no default: the app refuses to start without it, so a deployment can
# never run with a publicly known secret. (The dev profile and tests set their own.)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Comma-separated origins allowed to call the API from another site. Wildcards are allowed,
# e.g. https://*.techy.pages.dev for Cloudflare Pages preview deployments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# When set, every /api request must carry this value in X-Proxy-Secret (the Cloudflare Pages
# proxy adds it). Blocks direct calls that would skip the proxy, and lets the backend trust X-Real-IP.
app.security.proxy-secret=${PROXY_SECRET:}

management.endpoints.web.exposure.include=health

# Uploaded images (post photos, profile pictures).
#   STORAGE_TYPE=local  files in STORAGE_DIR (needs a persistent volume: docker-compose, a VPS)
#   STORAGE_TYPE=s3     S3-compatible bucket, e.g. Cloudflare R2 (recommended on cloud hosts,
#                       whose disks are usually wiped on every deploy)
app.storage.type=${STORAGE_TYPE:local}
app.storage.dir=${STORAGE_DIR:uploads}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
app.storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
app.storage.max-image-bytes=8388608
# Slightly above the image limit so the multipart envelope + caption fit.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Public address of the site, used in links inside emails (verify email, reset password).
app.base-url=${APP_BASE_URL:http://localhost:3000}

# --- Email (SMTP). Leave SMTP_HOST empty in development: emails are then written to the log instead.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:Techy <no-reply@localhost>}

# --- Accounts and abuse protection
# New accounts must confirm their email before they can post, comment, like, follow or report.
app.auth.require-verified-email=${REQUIRE_EMAIL_VERIFICATION:true}
# Cloudflare Turnstile captcha on sign-up and password reset. Off while either key is empty.
app.captcha.turnstile.site-key=${TURNSTILE_SITE_KEY:}
app.captcha.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# Only set to true when the API is reachable solely through your reverse proxy (it sets X-Real-IP).
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
# Comma-separated emails that become moderators once that address is verified.
app.admin.emails=${ADMIN_EMAILS:}

# --- Image privacy: image links are signed and expire (each link is valid for 12-24 hours).
app.media.url-ttl-hours=12
