server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Photo uploads: nginx's default limit is 1 MB. The backend caps images at 8 MB.
    client_max_body_size 10m;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The site and its API share one origin behind nginx, so the backend doesn't need CORS checks.
    # Without this, opening the site by any other address (a LAN IP from a phone, a custom domain)
    # fails with "Invalid CORS request". Same approach as the Cloudflare Pages proxy. Still safe:
    # logins use bearer tokens browsers never send automatically, and with no Origin the backend adds
    # no Access-Control-Allow-Origin header, so other websites still can't read API responses.
    proxy_set_header Origin "";
  }

  # Service worker and manifest must always be revalidated, or browsers can keep running an old
  # app version. Service-Worker-Allowed keeps the worker's scope at the site root.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }
  location = /push-handler.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location ~ ^/workbox-.*\.js$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    # nginx's stock mime.types has no entry for .webmanifest
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Vite puts a content hash in every file name under /assets/, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # The app shell: always check for a new index.html so new deployments are picked up.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
