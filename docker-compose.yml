services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devsocial
      POSTGRES_USER: ${DB_USERNAME:-devsocial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devsocial}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devsocial} -d devsocial"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/devsocial
      DB_USERNAME: ${DB_USERNAME:-devsocial}
      DB_PASSWORD: ${DB_PASSWORD:-devsocial}
      # Required, 32+ characters. No default on purpose: a public default secret lets anyone forge tokens.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env - see .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Photos: local volume by default; set STORAGE_TYPE=s3 + S3_* to use Cloudflare R2 instead.
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_DIR: /app/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Public address of the site, used in email links.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Email (SMTP). Without SMTP_HOST, emails are printed in `docker compose logs backend` instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Techy <no-reply@localhost>}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      # Cloudflare Turnstile captcha. Off until both keys are set.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # The backend is only reachable through nginx (see ports below), so its X-Real-IP header can be trusted.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      # Uploaded photos and profile pictures. Back this up along with the database.
      - uploads:/app/uploads
    ports:
      # Localhost only: the public entry point is nginx on :3000. Exposing :8080 to the internet would let
      # clients fake X-Real-IP and dodge the rate limits.
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
